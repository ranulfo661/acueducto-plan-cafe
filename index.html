<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acueducto Plan Café – El Valle · Presentación</title>
<meta name="description" content="Acueducto rural por gravedad en 4 fases: del manantial Usebia a 11 llaves públicas. El Llano, Elías Piña. Presentación con simulación interactiva.">
<meta name="theme-color" content="#FCF0E0">
<meta property="og:type" content="website">
<meta property="og:title" content="Acueducto Plan Café – El Valle · Apadrina una fase">
<meta property="og:description" content="Del manantial a 11 llaves, todo por gravedad. 21 láminas con simulación interactiva del agua en 4 fases.">
<meta property="og:image" content="https://ranulfo661.github.io/acueducto-plan-cafe/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://ranulfo661.github.io/acueducto-plan-cafe/">
<link rel="preload" as="image" href="lamina_01.png">
<style>
:root{--cr:#FCF0E0;--bg:#F1E3CB;--az:#103850;--oc:#B47614;--gr:#5E666A;--ln:#D8CCB4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--az);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;align-items:center;padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom))}
.top{width:var(--sw);display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:34px;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.top .t{font-weight:700;color:var(--oc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .c{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--gr);letter-spacing:.04em;white-space:nowrap}
.stagewrap{position:relative;flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
.viewport{position:relative;width:var(--sw);height:var(--sh);overflow:hidden;border-radius:6px;box-shadow:0 10px 30px rgba(16,56,80,.18);background:var(--cr);touch-action:pan-y}
.track{display:flex;height:100%;transition:transform .38s cubic-bezier(.2,.7,.2,1);will-change:transform}
.track.drag{transition:none}
.slide{flex:0 0 100%;height:100%;position:relative;background:var(--cr)}
.slide img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.slide iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--cr)}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:2px solid var(--az);background:rgba(252,240,224,.92);color:var(--az);font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.nav:disabled{opacity:.25;cursor:default}
.nav.prev{left:calc(50% - var(--sw)/2 - 68px)}.nav.next{right:calc(50% - var(--sw)/2 - 68px)}
.bottom{width:var(--sw);padding-top:10px}
.bar{height:4px;background:var(--ln);border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--oc);transition:width .38s}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;min-height:44px}
.row .m{display:none;gap:8px}
.btn{font:700 14px system-ui,sans-serif;color:var(--az);background:transparent;border:2px solid var(--az);border-radius:6px;min-height:44px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn.solid{background:var(--az);color:var(--cr)}
.hint{font-size:13px;color:var(--gr);text-align:center;flex:1}
.simlink{display:none}.simlink .sh{display:none}.onsim .simlink{display:inline-flex}.onsim .hint{display:none}
:focus-visible{outline:3px solid var(--oc);outline-offset:3px}
@media (max-width:820px){.nav{display:none}.row .m{display:flex}.hint{display:none}.onsim .simlink{flex:1}.simlink .lg{display:none}.simlink .sh{display:inline}.onsim #pdf{display:none}}
@media (prefers-reduced-motion:reduce){.track,.bar i{transition:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top"><span class="t">Acueducto Plan Café – El Valle</span><span class="c" id="count">01 / 21</span></div>
  <div class="stagewrap">
    <button class="nav prev" id="prev" type="button" aria-label="Lámina anterior">‹</button>
    <div class="viewport" id="vp" role="region" aria-roledescription="carrusel" aria-label="Presentación del acueducto">
      <div class="track" id="track"></div>
    </div>
    <button class="nav next" id="next" type="button" aria-label="Lámina siguiente">›</button>
  </div>
  <div class="bottom">
    <div class="bar"><i id="prog"></i></div>
    <div class="row">
      <span class="m"><button class="btn" id="prev2" type="button" aria-label="Lámina anterior">‹ Anterior</button></span>
      <a class="btn simlink" href="simulacion.html" target="_blank" rel="noopener"><span class="lg">Abrir simulación completa</span><span class="sh">Ampliar</span>&nbsp;↗</a>
      <span class="hint">Deslice o use las flechas ← →</span>
      <span class="m"><button class="btn solid" id="next2" type="button" aria-label="Lámina siguiente">Siguiente ›</button></span>
      <a class="btn" id="pdf" href="Acueducto_PlanCafe_ElValle_carrusel.pdf" download>PDF</a>
    </div>
  </div>
</div>
<script>
(function(){
const ALT=['Acueducto Plan Café – El Valle','La necesidad: caminar 4–5 km por agua','Ubicación: del manantial a las llaves','El proyecto en cifras','La solución: qué se va a construir','Cuatro fases',
 null,
 'Perfil: baja 413 m sin bombas','Corte: un tanque de 40.8 m³','Diseñado con normas','Cálculo: la toma cubre la demanda','Seguridad: tanques seguros','Presupuesto: RD$ 17.5 millones','Fase 1: la columna vertebral','Pareto: cinco partidas suman el 73 %','Cronograma: 14 meses en 4 fases','Operación: la comunidad lo opera','Sostenibilidad: menos de RD$ 110 al mes','Impacto: lo que cambia en la comunidad','Antes y después: un diseño corregido','La petición: apadrina una fase'];
const SIM=6; // posición (0-based) de la lámina interactiva, después de «Cuatro fases»
const N=ALT.length, track=document.getElementById('track'), vp=document.getElementById('vp'), app=document.getElementById('app');
let png=1;
ALT.forEach((alt,i)=>{
  const s=document.createElement('div'); s.className='slide'; s.setAttribute('role','group'); s.setAttribute('aria-roledescription','lámina'); s.setAttribute('aria-label',(i+1)+' de '+N);
  if(i===SIM){ s.dataset.sim='1'; }
  else { const im=new Image(); im.alt=alt; im.decoding='async'; im.dataset.src='lamina_'+String(png).padStart(2,'0')+'.png'; png++; s.appendChild(im); }
  track.appendChild(s);
});
const slides=[...track.children];
function load(i){ const s=slides[i]; if(!s) return;
  if(s.dataset.sim){ if(!s.querySelector('iframe')){ const f=document.createElement('iframe'); f.src='sim-lamina.html'; f.title='Simulación interactiva: así llega el agua, por fases'; f.loading='eager'; s.appendChild(f);} return; }
  const im=s.querySelector('img'); if(im && !im.src) im.src=im.dataset.src; }
// tamaño de la lámina 4:5 que quepa en la pantalla
function size(){
  const W=innerWidth, H=innerHeight, wide=W>820;
  const availW=W-(wide?180:24), availH=H-(wide?120:130);
  let w=Math.min(availW, availH*0.8, 1080); w=Math.max(220,Math.floor(w));
  app.style.setProperty('--sw',w+'px'); app.style.setProperty('--sh',Math.round(w*1.25)+'px');
}
addEventListener('resize',size); size();
let cur=0;
function go(i,fromHash){
  cur=Math.max(0,Math.min(N-1,i));
  track.style.transform='translateX('+(-cur*100)+'%)';
  for(let k=cur-1;k<=cur+2;k++) load(k);
  document.getElementById('count').textContent=String(cur+1).padStart(2,'0')+' / '+N;
  document.getElementById('prog').style.width=((cur+1)/N*100)+'%';
  ['prev','prev2'].forEach(id=>document.getElementById(id).disabled=cur===0);
  ['next','next2'].forEach(id=>document.getElementById(id).disabled=cur===N-1);
  app.classList.toggle('onsim',cur===SIM);
  slides.forEach((s,k)=>s.setAttribute('aria-hidden',String(k!==cur)));
  if(!fromHash) history.replaceState(null,'','#'+(cur+1));
}
['prev','prev2'].forEach(id=>document.getElementById(id).addEventListener('click',()=>go(cur-1)));
['next','next2'].forEach(id=>document.getElementById(id).addEventListener('click',()=>go(cur+1)));
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key==='PageDown'){go(cur+1);e.preventDefault();} else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(cur-1);e.preventDefault();} else if(e.key==='Home'){go(0);} else if(e.key==='End'){go(N-1);} });
// deslizar con el dedo o el mouse
let x0=null,y0=0,dx=0,t0=0,horiz=null;
vp.addEventListener('pointerdown',e=>{ if(e.button>0) return; x0=e.clientX; y0=e.clientY; dx=0; horiz=null; t0=Date.now(); });
vp.addEventListener('pointermove',e=>{ if(x0===null) return; const ddx=e.clientX-x0, ddy=e.clientY-y0;
  if(horiz===null && (Math.abs(ddx)>8||Math.abs(ddy)>8)){ horiz=Math.abs(ddx)>Math.abs(ddy); if(horiz){ track.classList.add('drag'); try{vp.setPointerCapture(e.pointerId);}catch(_){} } }
  if(horiz){ dx=ddx; const edge=(cur===0&&dx>0)||(cur===N-1&&dx<0)?.35:1; track.style.transform='translateX(calc('+(-cur*100)+'% + '+(dx*edge)+'px))'; } });
function end(){ if(x0===null) return; track.classList.remove('drag');
  if(horiz){ const w=vp.clientWidth, fast=Math.abs(dx)>30&&Date.now()-t0<300; if(dx<-w*.18||(fast&&dx<0)) go(cur+1); else if(dx>w*.18||(fast&&dx>0)) go(cur-1); else go(cur); }
  x0=null; horiz=null; }
vp.addEventListener('pointerup',end); vp.addEventListener('pointercancel',end); vp.addEventListener('lostpointercapture',end);
addEventListener('message',e=>{ if(e.data&&typeof e.data.vellNav==='number'&&e.source===slides[SIM].querySelector('iframe')?.contentWindow) go(cur+e.data.vellNav); });
// abrir en la lámina del enlace (#7 = simulación)
const h=parseInt(location.hash.slice(1),10); go(isNaN(h)?0:h-1,true);
addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1),10); if(!isNaN(n)&&n-1!==cur) go(n-1,true);});
})();
</script>
</body>
</html>
